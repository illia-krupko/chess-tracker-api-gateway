services:
  gateway:
    build: .
    restart: on-failure
    ports:
      - "${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}"
    env_file:
      - .env
    environment:
      GAME_SERVICE_URI: ${GAME_SERVICE_URI:-http://game-service:8082}
      USER_SERVICE_URI: ${USER_SERVICE_URI:-http://user-service:8083}
      ANALYSIS_SERVICE_URI: ${ANALYSIS_SERVICE_URI:-http://analysis-service:8084}
      STATISTICS_SERVICE_URI: ${STATISTICS_SERVICE_URI:-http://statistics-service:8085}
    networks:
      - default
      - chesstracker

networks:
  chesstracker:
    external: true
